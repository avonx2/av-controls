[package]
name = "av-controls"
version = "0.1.0"
edition = "2024"
description = "Rust receiver (artwork side) for the av-controls websocket broker"
license = "MIT"
repository = "https://github.com/avonx2/av-controls"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
tungstenite = { version = "0.26", default-features = false, features = ["__rustls-tls", "handshake"] }
